name: DailyCheckIn

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install dailycheckin
      - name: Run checkin
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          NETEASEMUSIC_COOKIE: ${{ secrets.NETEASEMUSIC_COOKIE }}
          IQIYI_COOKIE: ${{ secrets.IQIYI_COOKIE }}
          TIEBA_COOKIE: ${{ secrets.TIEBA_COOKIE }}
          TENCENT_VIDEO_COOKIE: ${{ secrets.TENCENT_VIDEO_COOKIE }}
          YOUDAO_COOKIE: ${{ secrets.YOUDAO_COOKIE }}
          BAIDUWP_COOKIE: ${{ secrets.BAIDUWP_COOKIE }}
          SMZDM_COOKIE: ${{ secrets.SMZDM_COOKIE }}
          V2EX_COOKIE: ${{ secrets.V2EX_COOKIE }}
          ACFUN_COOKIE: ${{ secrets.ACFUN_COOKIE }}
          ALIYUN_COOKIE: ${{ secrets.ALIYUN_COOKIE }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: dailycheckin
